# Server Configuration
server.port=${PORT:8080}
spring.application.name=preppath-backend

# PostgreSQL Database Configuration
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/preppath_db}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
jwt.secret=${JWT_SECRET:yourSecretKey256BitChangeThisInProductionMakeItLongEnoughForSecurity}
jwt.expiration=86400000

# CORS Configuration (permitir frontend desde cualquier origen temporalmente)
cors.allowed.origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:5173}

# Logging
logging.level.com.preppath=INFO
logging.level.org.springframework.security=INFO

# ==========================================
# MAIL CONFIGURATION (Gmail SMTP)
# ==========================================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# App base URL (used in reset password links)
app.base.url=${APP_BASE_URL:https://preppathapp.com}

# ==========================================
# OAUTH CONFIGURATION
# ==========================================
github.client.id=${GITHUB_CLIENT_ID:}
github.client.secret=${GITHUB_CLIENT_SECRET:}

# ==========================================
# STRIPE CONFIGURATION
# ==========================================
stripe.api.key=${STRIPE_SECRET_KEY}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET:}
stripe.success.url=https://preppathapp.com/payment/success
stripe.cancel.url=https://preppathapp.com/payment/cancel
