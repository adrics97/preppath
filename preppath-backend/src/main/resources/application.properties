# Server Configuration
server.port=8080
spring.application.name=preppath-backend

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5433/preppath_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
jwt.secret=dGhpc0lzQVNlY3JldEtleUZvckpXVFRva2VuR2VuZXJhdGlvblByZXBQYXRoQXBwMjAyNg
jwt.expiration=86400000

# CORS Configuration (for React frontend)
cors.allowed.origins=http://localhost:3000,http://localhost:5173

# Logging
logging.level.com.preppath=DEBUG
logging.level.org.springframework.security=DEBUG
