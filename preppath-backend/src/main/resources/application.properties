# Server Configuration
server.port=${PORT:8080}
spring.application.name=preppath-backend

# PostgreSQL Database Configuration
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5433/preppath_db}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
jwt.secret=${JWT_SECRET:yourSecretKey256BitChangeThisInProductionMakeItLongEnoughForSecurity}
jwt.expiration=86400000

# CORS Configuration (permitir frontend desde cualquier origen temporalmente)
cors.allowed.origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:5173}

# Logging
logging.level.com.preppath=INFO
logging.level.org.springframework.security=INFO